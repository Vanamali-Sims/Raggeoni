[project]
name = "raggeoni"
version = "0.2.0"
description = "NEM price-spike investigator: multi-agent root-cause analysis, RAG over market notices, and a ground-truth-first eval harness"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.0",
]

[project.optional-dependencies]
# Agent team (LangGraph orchestration) and AER report parsing.
spike = [
    "langgraph>=1.0",
    "pypdf>=5.0",
]
# Real sentence embeddings for notice retrieval. Without this, retrieval
# uses BM25 plus a hashing embedder (no model download).
embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
raggeoni-ingest = "raggeoni.ingest:main"
raggeoni-plan = "raggeoni.plan:main"
raggeoni-hydrate = "raggeoni.hydrate:main"
raggeoni-eval = "raggeoni.eval:main"
raggeoni-spike = "raggeoni.spike.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raggeoni = ["schema.sql", "plan_schema.json", "baseline/prompt.txt", "spike/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.mypy]
python_version = "3.11"
files = ["src/raggeoni/spike"]
ignore_missing_imports = true
check_untyped_defs = true
