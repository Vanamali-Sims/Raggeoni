[project]
name = "raggeoni"
version = "0.1.0"
description = "NEM eval harness — ground truth first"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.0",
]

[project.scripts]
raggeoni-ingest = "raggeoni.ingest:main"
raggeoni-plan = "raggeoni.plan:main"
raggeoni-hydrate = "raggeoni.hydrate:main"
raggeoni-eval = "raggeoni.eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raggeoni = ["schema.sql", "plan_schema.json", "baseline/prompt.txt"]
