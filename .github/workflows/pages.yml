name: pages

# Builds the static site (investigation feed + health) and deploys it to
# GitHub Pages. Called by watch, investigate and warden, because pushes made
# with the workflow token do not trigger other workflows.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "investigations/**"
      - "health/**"
      - "src/raggeoni/spike/site.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e .
      - run: raggeoni-spike site --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
